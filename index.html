<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vortex</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@20.0.0"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#071a33;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.container{width:100%;max-width:500px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px rgba(7,26,51,.08)}
.logo{font-size:30px;font-weight:800;letter-spacing:2px}
.tagline{margin-top:5px;font-size:12px;letter-spacing:2px;color:#667085}
.title{font-size:24px;font-weight:700;margin-bottom:8px}
.subtitle{font-size:14px;color:#667085;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}
input,select{width:100%;padding:14px;border:1px solid #d9dee7;border-radius:11px;outline:none;background:#fff;color:#071a33}
input:focus,select:focus{border-color:#071a33}
.mainbtn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:#071a33;color:#fff;font-weight:700}
.secondarybtn{width:100%;border:1px solid #071a33;border-radius:12px;padding:13px;margin-top:10px;background:#fff;color:#071a33;font-weight:700}
.msg{margin-top:12px;font-size:13px;line-height:1.4}
.msg.err{color:#c62828}
.msg.ok{color:#188038}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.smallbtn{border:0;background:#eef2f7;color:#071a33;border-radius:10px;padding:9px 12px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>

<body>

<div>

</div>

<div class="subtitle">Welcome back</div>

</div>

<div class="card">

</div>

<script>
const{Client,Account,TablesDB,ID,Query}=Appwrite;

const ENDPOINT="https://fra.cloud.appwrite.io/v1";
const PROJECT_ID="6a903d26002edcba7c43";
const DATABASE_ID="6ab93e1f001b1a60b658";

const T={
users:"6ab972e60038e2121462",
deposits:"6abc15840015fbc8ad75",
withdrawals:"6abc1c3d0006a5526d37",
products:"6abc2545003164242377",
investments:"6abc26e2000f85014be0",
referrals:"6abcfb0b0027beb5cb1a"
};

const client=new Client()
.setEndpoint(ENDPOINT)
.setProject(PROJECT_ID);

const account=new Account(client);
const db=new TablesDB(client);

let user=null;
let currentProfile=null;

function $(id){return document.getElementById(id)}

function showScreen(id){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
const el=$(id);
if(el)el.classList.add("active");
}

function msg(id,text,type=""){
const el=$(id);
if(!el)return;
el.textContent=text;
el.className="msg "+type;
}

async function getUserById(userId){
const result=await db.listRows(
DATABASE_ID,
T.users,
[Query.equal("userId",userId),Query.limit(1)]
);
return result.rows&&result.rows.length?result.rows[0]:null;
}

<select id="depositRecipient">
<option value="0730072027">Reagan Ssentongo — 0730072027</option>
<option value="0758321354">Lawrence Lutaaya — 0758321354</option>
<option value="0752215102">Fabious Bahati — 0752215102</option>
</select>

  <div id="popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px;z-index:9999">
<div class="card" style="width:100%;max-width:380px;text-align:center">
<div id="popupText" style="font-size:16px;line-height:1.5"></div>
<button class="mainbtn" onclick="closePopup()">OK</button>
</div>
</div>

<script>
function alertBox(text){
$("popupText").textContent=text;
$("popup").style.display="flex";
}

function closePopup(){
$("popup").style.display="none";
}

function escapeHTML(value){
return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function money(value){
return"UGX "+Number(value||0).toLocaleString();
}

async function refreshProfile(){
if(!user)return false;

const profile=await getUserById(user.$id);

if(!profile){
currentProfile=null;
return false;
}

currentProfile=profile;
return true;
}

function updateHomeNumbers(){

if(!currentProfile)return;

$("homeUsername").textContent=
currentProfile.username||user.name||"Vortex User";

$("walletAmount").textContent=
money(currentProfile.wallet);

$("balanceAmount").textContent=
money(currentProfile.balance);

}

function openProfile(){

if(!currentProfile)return showLogin();

$("profileUsername").textContent=
currentProfile.username||"—";

$("profilePhone").textContent=
currentProfile.phone||"—";

$("profileEmail").textContent=
currentProfile.email||user.email||"—";

$("profileVip").textContent=
currentProfile.viplevel??0;

showScreen("profileScreen");
}

async function showHome(){

if(!currentProfile){

const ok=await refreshProfile();

if(!ok){
showLogin();
return;
}

}

updateHomeNumbers();
showScreen("homeScreen");
    }
  async function register(){

const username=$("regUsername").value.trim();
const phone=$("regPhone").value.trim();
const email=$("regEmail").value.trim();
const password=$("regPassword").value;
const confirm=$("regConfirm").value;

msg("regMsg","","");

if(username.length<4)
return msg("regMsg","Username must be at least 4 characters.","err");

if(!/^07\d{8}$/.test(phone))
return msg("regMsg","Phone must be in the format 07XXXXXXXX.","err");

if(!email)
return msg("regMsg","Email is required.","err");

if(password.length<8)
return msg("regMsg","Password must be at least 8 characters.","err");

if(password!==confirm)
return msg("regMsg","Passwords do not match.","err");

try{

const existing=await db.listRows(
DATABASE_ID,
T.users,
[Query.equal("phone",phone),Query.limit(1)]
);

if(existing.rows&&existing.rows.length)
return msg("regMsg","That phone number is already registered.","err");

const newAccount=await account.create(
ID.unique(),
email,
password,
username
);

await db.createRow(
DATABASE_ID,
T.users,
ID.unique(),
{
userId:newAccount.$id,
username,
phone,
email,
wallet:0,
balance:0,
viplevel:0,
totalearned:0,
totalwithdrawn:0,
totaldeposited:0,
blocked:false
}
);

await account.createEmailPasswordSession(email,password);

user=await account.get();

const ok=await refreshProfile();

if(!ok){
throw new Error("Account profile could not be loaded.");
}

await showHome();

}catch(e){

msg("regMsg",e.message||"Registration failed.","err");

}

}


async function login(){

const email=$("loginEmail").value.trim();
const password=$("loginPassword").value;

msg("loginMsg","","");

if(!email||!password)
return msg("loginMsg","Enter your email and password.","err");

try{

await account.createEmailPasswordSession(
email,
password
);

user=await account.get();

const ok=await refreshProfile();

if(!ok){

await account.deleteSession("current");

return msg(
"loginMsg",
"Your account profile was not found.",
"err"
);

}

if(currentProfile.blocked===true){

await account.deleteSession("current");

user=null;
currentProfile=null;

return msg(
"loginMsg",
"Your account has been blocked.",
"err"
);

}

await showHome();

}catch(e){

msg(
"loginMsg",
e.message||"Login failed.",
"err"
);

}

}


async function logout(){

try{
await account.deleteSession("current");
}catch(e){}

user=null;
currentProfile=null;

showLogin();

    }
  async function openDeposit(){

if(!currentProfile)return showLogin();

$("depositPhone").value=
currentProfile.phone||"";

$("depositAmount").value="";
$("depositTransaction").value="";

msg("depositMsg","","");

showScreen("depositScreen");

}


async function submitDeposit(){

const amount=Number($("depositAmount").value);
const recipient=$("depositRecipient").value;
const phone=$("depositPhone").value.trim();
const transaction=$("depositTransaction").value.trim();

msg("depositMsg","","");

if(!amount||amount<=0)
return msg("depositMsg","Enter a valid deposit amount.","err");

if(!/^07\d{8}$/.test(phone))
return msg("depositMsg","Enter a valid phone number.","err");

if(phone!==currentProfile.phone)
return msg("depositMsg","Phone must match your registered phone.","err");

if(!transaction)
return msg("depositMsg","Enter the transaction ID.","err");

try{

await db.createRow(
DATABASE_ID,
T.deposits,
ID.unique(),
{
userId:user.$id,
username:currentProfile.username,
phone,
amount,
recepient:recipient,
transactionId:transaction,
status:"pending",
createdAt:new Date().toISOString()
}
);

msg(
"depositMsg",
"Deposit submitted successfully and is pending review.",
"ok"
);

$("depositAmount").value="";
$("depositTransaction").value="";

}catch(e){

msg(
"depositMsg",
e.message||"Could not submit deposit.",
"err"
);

}

}


async function openWithdraw(){

if(!currentProfile)return showLogin();

$("withdrawPhone").value=
currentProfile.phone||"";

$("withdrawAmount").value="";

msg("withdrawMsg","","");

showScreen("withdrawScreen");

}
  async function submitWithdrawal(){

const phone=$("withdrawPhone").value.trim();
const amount=Number($("withdrawAmount").value);

msg("withdrawMsg","","");

if(!/^07\d{8}$/.test(phone))
return msg("withdrawMsg","Enter a valid phone number.","err");

if(phone!==currentProfile.phone)
return msg("withdrawMsg","Phone must match your registered phone.","err");

if(!amount||amount<=0)
return msg("withdrawMsg","Enter a valid amount.","err");

if(amount<5000)
return msg("withdrawMsg","Minimum withdrawal is UGX 5,000.","err");

if(amount>5000000)
return msg("withdrawMsg","Maximum withdrawal is UGX 5,000,000.","err");

if(Number(currentProfile.balance||0)<amount)
return msg("withdrawMsg","Insufficient available balance.","err");

const now=new Date();

const localDate=new Intl.DateTimeFormat(
"en-CA",
{timeZone:"Africa/Kampala"}
).format(now);

const parts=new Intl.DateTimeFormat(
"en-GB",
{
timeZone:"Africa/Kampala",
hour:"2-digit",
hour12:false
}
).formatToParts(now);

const hour=Number(
parts.find(x=>x.type==="hour")?.value||0
);

if(hour<8||hour>=14)
return msg(
"withdrawMsg",
"Withdrawals are available from 8:00 AM to 2:00 PM.",
"err"
);

try{

const existing=await db.listRows(
DATABASE_ID,
T.withdrawals,
[
Query.equal("userId",user.$id),
Query.equal("date",localDate),
Query.limit(1)
]
);

if(existing.rows&&existing.rows.length)
return msg(
"withdrawMsg",
"Only one withdrawal is allowed per day.",
"err"
);

await db.createRow(
DATABASE_ID,
T.withdrawals,
ID.unique(),
{
userId:user.$id,
username:currentProfile.username,
phone,
amount,
status:"pending",
date:localDate,
createdAt:now.toISOString()
}
);

msg(
"withdrawMsg",
"Withdrawal submitted and is pending processing.",
"ok"
);

$("withdrawAmount").value="";

}catch(e){

msg(
"withdrawMsg",
e.message||"Withdrawal submission failed.",
"err"
);

}

}


async function openProducts(){

showScreen("productsScreen");

const box=$("productsList");

box.innerHTML=
'<div class="card">Loading products...</div>';

try{

const result=await db.listRows(
DATABASE_ID,
T.products,
[Query.limit(100)]
);

if(!result.rows.length){

box.innerHTML=
'<div class="card">No products available.</div>';

return;
}

box.innerHTML="";

result.rows.forEach(p=>{

const div=document.createElement("div");

div.className="card";

div.innerHTML=`
<div class="title" style="font-size:19px">
${escapeHTML(p.name||"Product")}
</div>

<div class="subtitle">
Price: ${money(p.price)}
</div>

<div class="subtitle" style="margin-top:7px">
${escapeHTML(p.description||"")}
</div>

<button class="mainbtn"
onclick="buyProduct('${p.$id}')">
Purchase
</button>
`;

box.appendChild(div);

});

}catch(e){

box.innerHTML=
'<div class="card">Unable to load products.</div>';

}

}
  async function buyProduct(productId){

try{

const product=await db.getRow(
DATABASE_ID,
T.products,
productId
);

const price=Number(product.price||0);
const wallet=Number(currentProfile.wallet||0);

if(wallet<price)
return alertBox("Insufficient wallet balance.");

await db.createRow(
DATABASE_ID,
T.investments,
ID.unique(),
{
userId:user.$id,
productId:product.$id,
productName:product.name||"",
amount:price,
status:"active",
createdAt:new Date().toISOString()
}
);

await db.updateRow(
DATABASE_ID,
T.users,
currentProfile.$id,
{
wallet:wallet-price
}
);

currentProfile.wallet=wallet-price;

updateHomeNumbers();

alertBox("Purchase submitted successfully.");

}catch(e){

alertBox(e.message||"Purchase failed.");

}

}

  }
  async function refreshAll(){

try{

if(!user)return false;

const fresh=await getUserById(user.$id);

if(!fresh)return false;

if(fresh.blocked===true){

await logout();

return false;

}

currentProfile=fresh;

updateHomeNumbers();

return true;

}catch(e){

return false;

}

}


async function sessionValid(){

try{

const sessionUser=await account.get();

user=sessionUser;

return true;

}catch(e){

user=null;

return false;

}

}


async function initialize(){

try{

const active=await sessionValid();

if(!active){

showLogin();

return;

}

const ok=await refreshAll();

if(!ok){

await logout();

return;

}

await showHome();

}catch(e){

user=null;
currentProfile=null;

showLogin();

}

}


async function safeRefresh(){

const ok=await refreshAll();

if(!ok){

showLogin();

return false;

}

return true;

}
  document.addEventListener(
"visibilitychange",
async()=>{
if(!document.hidden&&user){
await safeRefresh();
}
}
);

window.addEventListener(
"online",
async()=>{
if(user){
await safeRefresh();
}
}
);

if(e.key==="Enter")submitWithdrawal();
}
);

function clearMessages(){

[
"loginMsg",
"regMsg",
"depositMsg",
"withdrawMsg"
].forEach(id=>{

const el=$(id);

if(el){
el.textContent="";
el.className="msg";
}

});

}


function resetForms(){

[
"loginEmail",
"loginPassword",
"regUsername",
"regPhone",
"regEmail",
"regPassword",
"regConfirm",
"depositAmount",
"depositTransaction",
"withdrawAmount"
].forEach(id=>{

const el=$(id);

if(el)el.value="";

});

}


function goLogin(){

clearMessages();
resetForms();
showLogin();

}


function goRegister(){

clearMessages();
resetForms();
showScreen("registerScreen");

}


window.addEventListener(
"beforeunload",
()=>{
}
);
  initialize();

</script>
